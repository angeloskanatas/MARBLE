seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  accumulate_grad_batches: 1
  num_nodes: 1
  precision: 32-true
  max_epochs: 100
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "best"
        save_top_k: 1
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: "val/acc"
        patience: 10
        mode: "max"
  logger: false

model:
  class_path: marble.tasks.NSynthI.probe.ProbeOnEmbeddingsTask
  init_args:
    sample_rate: 24000
    use_ema: false

    encoder:
      class_path: marble.encoders.identity.model.IdentityEncoder
      init_args: {}

    emb_transforms: []

    decoders:
      - class_path: marble.modules.decoders.MLPDecoder
        init_args:
          in_dim: 768
          out_dim: 11
          hidden_layers: [512]
          activation_fn:
            class_path: torch.nn.ReLU
          dropout: 0.2

    losses:
      - class_path: torch.nn.CrossEntropyLoss
        init_args:
          reduction: mean

    metrics:
      train:
        acc:
          class_path: torchmetrics.Accuracy
          init_args: { num_classes: 11, task: multiclass }
      val:
        acc:
          class_path: torchmetrics.Accuracy
          init_args: { num_classes: 11, task: multiclass }
      test:
        acc:
          class_path: torchmetrics.Accuracy
          init_args: { num_classes: 11, task: multiclass }

data:
  class_path: marble.tasks.NSynthI.datamodule.NSynthIEmbeddingDataModule
  init_args:
    embedding_root: ./output/extracted_embeddings_probing/mert-95M_nsynth/
    layer_idx: 0
    train_jsonl: data/NSynth/NSynthI.train.jsonl
    val_jsonl: data/NSynth/NSynthI.val.jsonl
    test_jsonl: data/NSynth/NSynthI.test.jsonl
    batch_size: 64
    num_workers: 8

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    mode: "max"
    factor: 0.5
    patience: 3
    monitor: "val/acc"
