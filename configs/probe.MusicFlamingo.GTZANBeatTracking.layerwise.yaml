seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  accumulate_grad_batches: 8
  num_nodes: 1
  precision: 32-true
  max_epochs: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "best"
        save_top_k: 1
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: "val/beat_f1"
        patience: 10
        mode: "max"
  logger: false

model:
  class_path: marble.tasks.GTZANBeatTracking.probe.ProbeOnEmbeddingsTask
  init_args:
    sample_rate: 16000
    fps: 25
    use_ema: false
    loss_weights: [1.0, 1.0, 0.0]
    encoder:
      class_path: marble.encoders.identity.model.IdentityEncoder
      init_args: {}
    emb_transforms: []
    decoders:
      - class_path: marble.tasks.GTZANBeatTracking.probe.BeatDownbeatTempoMultitaskDecoder
        init_args:
          fps: 25
          use_ssl_for_tempo: false
          joint_decoder:
            class_path: marble.modules.decoders.MLPDecoderKeepTime
            init_args:
              in_dim: 1280
              out_dim: 3
              hidden_layers: [512]
              activation_fn:
                class_path: torch.nn.ReLU
              dropout: 0.2
          tempo_decoder:
            class_path: marble.tasks.GTZANBeatTracking.modules.FFTTempoEstimator
            init_args:
              label_fps: 25
              freq_resolution: 4
    losses:
      - class_path: marble.tasks.GTZANBeatTracking.probe.CustomBCEWithLogitsLoss
        init_args:
          pos_weight: null
          time_dim_mismatch_tol: 5
      - class_path: marble.tasks.GTZANBeatTracking.probe.CustomBCEWithLogitsLoss
        init_args:
          pos_weight: null
          time_dim_mismatch_tol: 5
      - class_path: torch.nn.MSELoss
        init_args:
          reduction: mean
    metrics:
      val:
        beat_f1:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TimeEventFMeasure
          init_args: { label_freq: 25, tol: 0.07, threshold: 0.99 }
        downbeat_f1:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TimeEventFMeasure
          init_args: { label_freq: 25, tol: 0.07, threshold: 0.99 }
        tempo_mae:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TempoMAE
        tempo_acc:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TempoAccuracy
          init_args: { tol: 0.04 }
      test:
        beat_f1:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TimeEventFMeasure
          init_args: { label_freq: 25, tol: 0.07, threshold: 0.99 }
        downbeat_f1:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TimeEventFMeasure
          init_args: { label_freq: 25, tol: 0.07, threshold: 0.99 }
        tempo_mae:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TempoMAE
        tempo_acc:
          class_path: marble.tasks.GTZANBeatTracking.metrics.TempoAccuracy
          init_args: { tol: 0.04 }

data:
  class_path: marble.tasks.GTZANBeatTracking.datamodule.GTZANBeatTrackingEmbeddingDataModule
  init_args:
    embedding_root: ./output/extracted_embeddings_probing/music-flamingo_gtzan_beattracking/
    layer_idx: 0
    train_jsonl: data/GTZAN/GTZANBeatTracking.train.jsonl
    val_jsonl: data/GTZAN/GTZANBeatTracking.val.jsonl
    test_jsonl: data/GTZAN/GTZANBeatTracking.test.jsonl
    clip_seconds: 10
    label_freq: 25
    min_clip_ratio: 0.8
    use_local_bpm: true
    train_num_neighbors: 2
    eval_num_neighbors: 0
    batch_size: 8
    num_workers: 8

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    mode: "max"
    factor: 0.5
    patience: 5
    monitor: "val/beat_f1"
