seed_everything: 1234
ckpt_path: null
trainer:
  fast_dev_run: false
  accelerator: gpu
  devices:
  - 0
  accumulate_grad_batches: 8
  num_nodes: 1
  precision: bf16
  max_epochs: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints
      filename: best
      save_top_k: 1
  - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
    init_args:
      monitor: val/acc
      patience: 20
      mode: max
  logger: false
model:
  class_path: marble.tasks.GTZANGenre.probe.ProbeOnEmbeddingsTask
  init_args:
    sample_rate: 16000
    use_ema: false
    encoder:
      class_path: marble.encoders.identity.model.IdentityEncoder
      init_args: {}
    emb_transforms: []
    decoders:
    - class_path: marble.modules.decoders.MLPDecoder
      init_args:
        in_dim: 192
        out_dim: 10
        hidden_layers:
        - 512
        activation_fn:
          class_path: torch.nn.ReLU
        dropout: 0.2
    losses:
    - class_path: torch.nn.CrossEntropyLoss
      init_args:
        reduction: mean
    metrics:
      train:
        acc: &id001
          class_path: torchmetrics.Accuracy
          init_args:
            num_classes: 10
            task: multiclass
      val:
        acc: *id001
      test:
        acc: *id001
data:
  class_path: marble.tasks.GTZANGenre.datamodule.GTZANGenreEmbeddingDataModule
  init_args:
    embedding_root: /scratch/embeddings/probing/mt2_gtzangenre/
    layer_idx: 0
    train_jsonl: data/GTZAN/GTZANGenre.train.jsonl
    val_jsonl: data/GTZAN/GTZANGenre.val.jsonl
    test_jsonl: data/GTZAN/GTZANGenre.test.jsonl
    batch_size: 8
    num_workers: 4
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 5e-3
lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    mode: max
    factor: 0.5
    patience: 6
    monitor: val/acc
