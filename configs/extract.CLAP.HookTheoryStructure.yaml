seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "./output/extracted_embeddings_probing/clap_hooktheory_structure/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 48000
    use_ema: false

    encoder:
      class_path: marble.encoders.CLAP.model.CLAPEncoder
      init_args:
        checkpoint_path: /home/akanatas/.cache/clap/music_audioset_epoch_15_esc_90.14.pt
        train_mode: freeze
        precomputed_lms: true
        model_name: base
        enable_fusion: false
        fusion_type: "None"

    emb_transforms: []

    extraction:
      split: train
      output_dir: ./output/extracted_embeddings_probing/clap_hooktheory_structure/
      save_split_subdir: true
      save_frame_level: false
      save_sequence_level: true
      max_samples: null

data:
  class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureDataModule
  init_args:
    batch_size: 8
    num_workers: 16

    audio_transforms:
      train:
        - class_path: marble.encoders.CLAP.model.CLAPFeatureExtractor
          init_args:
            precomputed_lms: false
            squeeze: true
      val:
        - class_path: marble.encoders.CLAP.model.CLAPFeatureExtractor
          init_args:
            precomputed_lms: false
            squeeze: true
      test:
        - class_path: marble.encoders.CLAP.model.CLAPFeatureExtractor
          init_args:
            precomputed_lms: false
            squeeze: true

    train:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioTrain
      init_args:
        sample_rate: 48000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: random
        jsonl: data/HookTheory/HookTheoryStructure.train.jsonl
    val:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioVal
      init_args:
        sample_rate: 48000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/HookTheory/HookTheoryStructure.val.jsonl
    test:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioTest
      init_args:
        sample_rate: 48000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/HookTheory/HookTheoryStructure.test.jsonl

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3
lr_scheduler: null
