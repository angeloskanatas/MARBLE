seed_everything: 1234
ckpt_path: null  # to resume

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: 32  # MT2 uses float32 (small model, no need for mixed precision)
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "/scratch/embeddings/mt2-cls-contrastive_discotube/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false

    encoder:
      class_path: marble.encoders.MT2.model.MT2_Encoder
      init_args:
        pre_trained_folder: null  # uses default: mt2/model_state_dict.pt
        train_mode: freeze
        pooling_mode: cls_contrastive  # cls_contrastive only

    emb_transforms:
      - class_path: marble.modules.transforms.LayerSelector
        init_args:
          layers: ["all"]  # extract all 13 layers (input + 12 blocks)
      - class_path: marble.modules.transforms.TimeAvgPool

    extraction:
      split: test
      output_dir: /scratch/embeddings/mt2-cls-contrastive_discotube/
      max_samples: 10000
      sampling_seed: 17
      save_frame_level: false
      save_sequence_level: true

      # General augmentations (same as other models)
      augmentation:
        num_augmentations: 10
        seed: 42
        transforms:
          - PitchShift:
              min_semitones: -4
              max_semitones: 4
              p: 0.8
          - TimeStretch:
              min_rate: 0.85
              max_rate: 1.15
              p: 0.7
          - Shift:
              min_shift: -0.2
              max_shift: 0.2
              rollover: true
              p: 0.7
          - AddGaussianNoise:
              min_amplitude: 0.005
              max_amplitude: 0.025
              p: 0.5
          - Gain:
              min_gain_db: -9.0
              max_gain_db: 6.0
              p: 0.6
          - LowPassFilter:
              min_cutoff_freq: 3000.0
              max_cutoff_freq: 8000.0
              p: 0.15

data:
  class_path: marble.tasks.RawAudio.datamodule.RawAudioDataModule
  init_args:
    batch_size: 32
    num_workers: 16

    # No audio_transforms — MT2 works directly on raw 16kHz waveforms
    train:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 4.0  # MT2 native input size
        min_clip_ratio: 0.8
        channel_mode: mix
        max_files: null
        random_seed: 42
        backend: "soundfile"
    val:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 4.0
        min_clip_ratio: 0.8
        channel_mode: mix
        max_files: null
        random_seed: 42
        backend: "soundfile"
    test:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 4.0
        min_clip_ratio: 0.8
        clips_per_file: 1
        clip_selection_seed: 42
        channel_mode: mix
        max_files: 20000
        random_seed: 42
        max_duration_seconds: 1800
        backend: "soundfile"

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler: null
