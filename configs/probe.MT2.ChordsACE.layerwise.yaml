seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  accumulate_grad_batches: 2
  num_nodes: 1
  precision: bf16
  max_epochs: 30
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "best"
        save_top_k: 1
        monitor: "val/loss"
        mode: "min"
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: "val/loss"
        patience: 5
        mode: "min"
  logger: false

model:
  class_path: marble.tasks.ChordsACE.probe.DecomposedChordProbe
  init_args:
    in_dim: 192
    hidden_dim: 512
    dropout: 0.2
    lr: 1e-3
    root_weight: 1.0
    bass_weight: 1.0
    tones_weight: 2.0
    time_dim_mismatch_tol: 5
    clip_seconds: 4.0
    label_freq: 32

data:
  class_path: marble.tasks.ChordsACE.datamodule.ChordsACEEmbeddingDataModule
  init_args:
    embedding_root: /scratch/embeddings/probing/mt2_chords1217/
    layer_idx: 0
    train_jsonl: data/Chords1217/Chords1217.train.jsonl
    val_jsonl: data/Chords1217/Chords1217.val.jsonl
    test_jsonl: data/Chords1217/Chords1217.test.jsonl
    clip_seconds: 4.0
    label_freq: 32
    min_clip_ratio: 0.1
    batch_size: 32
    num_workers: 4
