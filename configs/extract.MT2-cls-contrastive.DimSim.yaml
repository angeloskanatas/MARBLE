seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: 32
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "/scratch/embeddings/perceptual-sim/mt2-cls-contrastive_dimsim/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false

    encoder:
      class_path: marble.encoders.MT2.model.MT2_Encoder
      init_args:
        pre_trained_folder: null
        train_mode: freeze
        pooling_mode: cls_contrastive

    emb_transforms:
      - class_path: marble.modules.transforms.LayerSelector
        init_args:
          layers: ["all"]
      - class_path: marble.modules.transforms.TimeAvgPool

    extraction:
      split: test
      output_dir: /scratch/embeddings/perceptual-sim/mt2-cls-contrastive_dimsim/
      max_samples: null  # all 2637 clips
      sampling_seed: 17
      save_frame_level: false
      save_sequence_level: true  # mean-pooled embeddings for distance computation

data:
  class_path: marble.tasks.RawAudio.datamodule.RawAudioDataModule
  init_args:
    batch_size: 32
    num_workers: 8

    train:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/projects/layerbylayer/MARBLE/data/DimSim/DimSim.all.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 3.0  # DIM-SIM clips are pre-cut to 3 seconds
        min_clip_ratio: 0.8
        channel_mode: mix
        backend: "soundfile"
    val:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/projects/layerbylayer/MARBLE/data/DimSim/DimSim.all.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 3.0  # DIM-SIM clips are pre-cut to 3 seconds
        min_clip_ratio: 0.8
        channel_mode: mix
        backend: "soundfile"
    test:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        jsonl: /home/akanatas/projects/layerbylayer/MARBLE/data/DimSim/DimSim.all.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 3.0  # DIM-SIM clips are pre-cut to 3 seconds
        min_clip_ratio: 0.8
        channel_mode: mix
        backend: "soundfile"

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler: null
