seed_everything: 1234
ckpt_path: null  # to resume

trainer:
  fast_dev_run: false
  accelerator: gpu
  # strategy: ddp  # or ddp_find_unused_parameters
  devices: [0]
  num_nodes: 1
  precision: bf16-mixed  # or 32, or 16, or bf16-mixed (bf16 is deprecated)
  # no training needed for extraction, but Lightning requires these
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1  # only process 1 batch in test loop (test_step does nothing, extraction happens in on_test_start)

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      # save_dir: "/scratch/mtg/akanatas/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/"
      # save_dir: "/gpfs/projects/mtg/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/"
      save_dir: "/home/akanatas/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false

    encoder:
      class_path: marble.encoders.MAEST.model.MAESTEncoder
      init_args:
        arch: "discogs-maest-30s-pw-129e"
        #   - "discogs-maest-5s-pw-129e" (5s)
        #   - "discogs-maest-10s-pw-129e" (10s)
        #   - "discogs-maest-20s-pw-129e" (20s)
        #   - "discogs-maest-30s-pw-129e" (30s)
        pretrained: true
        # checkpoint: null  # path to .ckpt for custom MAEST encoder
        # checkpoint_format: null  # "custom" for custom checkpoint (encoder under backbone.*) | null (official MAEST)
        train_mode: freeze
        distilled_type: mean
        pooling: mean_patch  # concat (2304) | cls | dist | mean_patch (768)

    emb_transforms:
      - class_path: marble.modules.transforms.LayerSelector
        init_args:
          layers: ["all"]  # extract all layers
      - class_path: marble.modules.transforms.TimeAvgPool

    extraction:
      split: test  # options: train, val, test
      # output_dir: /scratch/mtg/akanatas/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/
      # output_dir: /gpfs/projects/mtg/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/
      output_dir: /home/akanatas/projects/layerbylayer/output/extracted_embeddings/maest-30s_discotube/
      max_samples: 10000  # null = all samples, or set to limit samples processed
      # subset_fraction: 0.1  # alternative to max_samples
      sampling_seed: 17
      save_frame_level: false   # frame-level embeddings (N, T, H)
      save_sequence_level: true  # sequence-level embeddings (N, H)
      # Note: MAEST returns already-pooled (sequence-level only); no frame-level.

      # optional: extract multiple augmented versions of the same audio
      augmentation:
        num_augmentations: 10
        seed: 42
        transforms:
          - PitchShift:
              min_semitones: -4
              max_semitones: 4
              p: 0.8
          - TimeStretch:
              min_rate: 0.85
              max_rate: 1.15
              p: 0.7
          - Shift:
              min_shift: -0.2
              max_shift: 0.2
              rollover: true
              p: 0.7
          - AddGaussianNoise:
              min_amplitude: 0.005
              max_amplitude: 0.025
              p: 0.5
          - Gain:
              min_gain_db: -9.0
              max_gain_db: 6.0
              p: 0.6
          - LowPassFilter:
              min_cutoff_freq: 3000.0
              max_cutoff_freq: 8000.0
              p: 0.15

data:
  class_path: marble.tasks.RawAudio.datamodule.RawAudioDataModule
  init_args:
    batch_size: 32
    num_workers: 16

    # MAEST handles audio preprocessing internally (mel inside model), no audio_transforms needed

    train:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        # audio_dir:  # use audio_dir for directory scanning mode
        # jsonl: /gpfs/projects/mtg/projects/discotube/discotube_balanced_ids.jsonl
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.0
        min_clip_ratio: 0.8  # at least 80% of the clip length
        channel_mode: mix  # first, random, mix
        max_files: null  # null = all files
        random_seed: 42
        backend: "soundfile"
        # backend: null  # optional: torchaudio backend (e.g., "soundfile", "sox_io")
    val:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        # audio_dir:  # use audio_dir for directory scanning mode
        # jsonl: /gpfs/projects/mtg/projects/discotube/discotube_balanced_ids.jsonl
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.0
        min_clip_ratio: 0.8  # at least 80% of the clip length
        channel_mode: mix  # first, random, mix
        max_files: null  # null = all files
        random_seed: 42
        backend: "soundfile"
        # backend: null  # optional: torchaudio backend (e.g., "soundfile", "sox_io")
    test:
      class_path: marble.tasks.RawAudio.datamodule.SimpleRawAudioDataset
      init_args:
        # audio_dir:  # use audio_dir for directory scanning mode
        # jsonl: /gpfs/projects/mtg/projects/discotube/discotube_balanced_ids.jsonl
        jsonl: /home/akanatas/discotube/discotube_balanced_ids_local.jsonl
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.0  # match arch (30s for discogs-maest-30s-*)
        min_clip_ratio: 0.8  # at least 80% of the clip length
        clips_per_file: 1  # one random clip per file
        clip_selection_seed: 42
        channel_mode: mix  # first, random, mix
        max_files: 20000  # null = all files
        random_seed: 42
        max_duration_seconds: 1800
        backend: "soundfile"
        # backend: null  # optional: torchaudio backend (e.g., "soundfile", "sox_io")

# not needed for extraction, but LightningCLI may require them
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler: null
