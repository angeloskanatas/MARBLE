seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "./output/extracted_embeddings_probing/music-flamingo_hooktheory_structure/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false

    encoder:
      class_path: marble.encoders.MusicFlamingo.model.MusicFlamingoEncoder
      init_args:
        pre_trained_folder: "nvidia/music-flamingo-2601-hf"
        train_mode: freeze
        attn_implementation: eager

    emb_transforms:
      - class_path: marble.modules.transforms.LayerSelector
        init_args:
          layers: ["all"]
      - class_path: marble.modules.transforms.TimeAvgPool

    extraction:
      split: train
      output_dir: ./output/extracted_embeddings_probing/music-flamingo_hooktheory_structure/
      save_split_subdir: true
      save_frame_level: false
      save_sequence_level: true
      max_samples: null

data:
  class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureDataModule
  init_args:
    batch_size: 16
    num_workers: 8

    audio_transforms:
      train:
        - class_path: marble.encoders.MusicFlamingo.model.MusicFlamingoFeatureExtractor
          init_args:
            pre_trained_folder: "nvidia/music-flamingo-2601-hf"
            squeeze: true
      val:
        - class_path: marble.encoders.MusicFlamingo.model.MusicFlamingoFeatureExtractor
          init_args:
            pre_trained_folder: "nvidia/music-flamingo-2601-hf"
            squeeze: true
      test:
        - class_path: marble.encoders.MusicFlamingo.model.MusicFlamingoFeatureExtractor
          init_args:
            pre_trained_folder: "nvidia/music-flamingo-2601-hf"
            squeeze: true

    train:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioTrain
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: random
        jsonl: data/HookTheory/HookTheoryStructure.train.jsonl
    val:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioVal
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/HookTheory/HookTheoryStructure.val.jsonl
    test:
      class_path: marble.tasks.HookTheoryStructure.datamodule.HookTheoryStructureAudioTest
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/HookTheory/HookTheoryStructure.test.jsonl

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3
lr_scheduler: null
