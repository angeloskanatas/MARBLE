seed_everything: 1234
ckpt_path: null

trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  accumulate_grad_batches: 4
  num_nodes: 1
  precision: 32-true
  max_epochs: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "best"
        save_top_k: 1
    - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
      init_args:
        monitor: "val/r2"
        patience: 20
        mode: "max"
  logger: false

model:
  class_path: marble.tasks.EMO.probe.ProbeOnEmbeddingsTask
  init_args:
    sample_rate: 16000
    use_ema: false
    encoder:
      class_path: marble.encoders.identity.model.IdentityEncoder
      init_args: {}
    emb_transforms: []
    decoders:
      - class_path: marble.modules.decoders.MLPDecoder
        init_args:
          in_dim: 1280
          out_dim: 2
          hidden_layers: [512]
          activation_fn:
            class_path: torch.nn.ReLU
          dropout: 0.2
    losses:
      - class_path: torch.nn.MSELoss
        init_args:
          reduction: mean
    metrics:
      train:
        r2:
          class_path: torchmetrics.R2Score
          init_args: { multioutput: uniform_average }
        arousal_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 0 }
        valence_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 1 }
      val:
        r2:
          class_path: torchmetrics.R2Score
          init_args: { multioutput: uniform_average }
        arousal_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 0 }
        valence_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 1 }
      test:
        r2:
          class_path: torchmetrics.R2Score
          init_args: { multioutput: uniform_average }
        arousal_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 0 }
        valence_r2:
          class_path: marble.tasks.EMO.probe.SliceR2
          init_args: { dim: 1 }

data:
  class_path: marble.tasks.EMO.datamodule.EMOEmbeddingDataModule
  init_args:
    embedding_root: ./output/extracted_embeddings_probing/music-flamingo_emo/
    layer_idx: 0
    train_jsonl: data/EMO/EMO.train.jsonl
    val_jsonl: data/EMO/EMO.val.jsonl
    test_jsonl: data/EMO/EMO.test.jsonl
    batch_size: 16
    num_workers: 8

optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    mode: "max"
    factor: 0.5
    patience: 5
    monitor: "val/r2"
