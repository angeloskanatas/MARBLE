seed_everything: 1234
ckpt_path: null
trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: 32
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1
  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./output/extracted_embeddings_probing/myna_gtzan_genre/
model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false
    encoder:
      class_path: marble.encoders.Myna.model.MynaBaseEncoder
      init_args:
        checkpoint_path: /home/akanatas/projects/music-jepa/myna/myna-base.pth
        train_mode: freeze
    emb_transforms:
    - class_path: marble.modules.transforms.LayerSelector
      init_args:
        layers: ["all"]
    - class_path: marble.modules.transforms.TimeAvgPool
    extraction:
      split: train
      output_dir: ./output/extracted_embeddings_probing/myna_gtzan_genre/
      save_split_subdir: true
      save_frame_level: false
      save_sequence_level: true
      max_samples: null
data:
  class_path: marble.tasks.GTZANGenre.datamodule.GTZANGenreDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    train:
      class_path: marble.tasks.GTZANGenre.datamodule.GTZANGenreAudioTrain
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.2
        min_clip_ratio: 0.8
        channel_mode: first
        jsonl: data/GTZAN/GTZANGenre.train.jsonl
    val:
      class_path: marble.tasks.GTZANGenre.datamodule.GTZANGenreAudioVal
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.2
        min_clip_ratio: 0.8
        channel_mode: first
        jsonl: data/GTZAN/GTZANGenre.val.jsonl
    test:
      class_path: marble.tasks.GTZANGenre.datamodule.GTZANGenreAudioTest
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 30.2
        min_clip_ratio: 0.8
        channel_mode: first
        jsonl: data/GTZAN/GTZANGenre.test.jsonl
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.001
lr_scheduler: null
