seed_everything: 1234
ckpt_path: null  # to resume

trainer:
  fast_dev_run: false
  accelerator: cpu  # use 'cpu' for CPU, 'mps' for Mac GPU, or 'gpu' for CUDA
  # strategy: ddp  # or ddp_find_unused_parameters
  # devices: [0] # use GPU
  devices: 1 # use CPU
  num_nodes: 1
  precision: bf16-mixed
  # no training needed for extraction, but Lightning requires these
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1  # only process 1 batch in test loop (extraction happens in on_test_start)

  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "./output/extracted_embeddings/musicgen-small_emo_test/"

model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 32000
    use_ema: false

    encoder:
      class_path: marble.encoders.MusicGen.model.MusicGenEncoder
      init_args:
        pre_trained_folder: null
        model_size: small  # options: small, medium, large, (stereo-small, stereo-medium, stereo-large)
        train_mode: freeze  # just inference
      
    emb_transforms:
      - class_path: marble.modules.transforms.LayerSelector
        init_args:
          layers: ["all"]
      - class_path: marble.modules.transforms.TimeAvgPool

    extraction:
      split: test  # options: train, val, test
      output_dir: output/extracted_embeddings/musicgen-small_emo_test/
      max_samples: null  # null = all samples
      # subset_fraction: 0.1  # alternative to max_samples: use x% of dataset
      save_frame_level: true   # frame-level embeddings (N, T, H)
      save_sequence_level: true  # sequence-level embeddings (N, H)

      # optional: extract multiple augmented versions of the same audio
      augmentation:
        num_augmentations: 2
        seed: 42
        transforms:
          - PolarityInversion:
              p: 0.5
          - Gain:
              min_gain_db: -6.0
              max_gain_db: 0.0
              p: 0.5
          - AddGaussianNoise:
              min_amplitude: 0.001
              max_amplitude: 0.01
              p: 0.6
          - BandPassFilter:
              min_center_freq: 200.0
              max_center_freq: 4000.0
              min_bandwidth_fraction: 0.6
              max_bandwidth_fraction: 1.0
              p: 0.25
          - Shift:
              min_shift: -0.1
              max_shift: 0.1
              rollover: true
              p: 0.4
          - LowPassFilter:
              min_cutoff_freq: 3000.0
              max_cutoff_freq: 8000.0
              p: 0.1

data:
  class_path: marble.tasks.EMO.datamodule.EMODataModule
  init_args:
    batch_size: 1
    num_workers: 4
    
    audio_transforms:
      train:
        - class_path: marble.encoders.MusicGen.model.MusicGenFeatureExtractor
          init_args:
            pre_trained_folder: null
            model_size: small
            squeeze: true
      val:
        - class_path: marble.encoders.MusicGen.model.MusicGenFeatureExtractor
          init_args:
            pre_trained_folder: null
            model_size: small
            squeeze: true
      test:
        - class_path: marble.encoders.MusicGen.model.MusicGenFeatureExtractor
          init_args:
            pre_trained_folder: null
            model_size: small
            squeeze: true  # FIXME: must be false for stereo?

    train:
      class_path: marble.tasks.EMO.datamodule.EMOAudioTrain
      init_args:
        sample_rate: 32000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.8  # at least 80% of the clip length
        channel_mode: first  # first, random, mix
        jsonl: data/EMO/EMO.train.jsonl
    val:
      class_path: marble.tasks.EMO.datamodule.EMOAudioVal
      init_args:
        sample_rate: 32000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.8
        channel_mode: first
        jsonl: data/EMO/EMO.val.jsonl
    test:
      class_path: marble.tasks.EMO.datamodule.EMOAudioTest
      init_args:
        sample_rate: 32000
        channels: 1
        clip_seconds: 15
        min_clip_ratio: 0.8
        channel_mode: first
        jsonl: data/EMO/EMO.test.jsonl

# not needed for extraction, but LightningCLI may require them
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-3

lr_scheduler: null
