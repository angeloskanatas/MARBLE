seed_everything: 1234
ckpt_path: null
trainer:
  fast_dev_run: false
  accelerator: gpu
  devices:
  - 0
  accumulate_grad_batches: 2
  num_nodes: 1
  precision: bf16
  max_epochs: 30
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 10
  log_every_n_steps: 5
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints
      filename: best
      save_top_k: 1
  - class_path: lightning.pytorch.callbacks.early_stopping.EarlyStopping
    init_args:
      monitor: val/acc
      patience: 5
      mode: max
  logger: false
model:
  class_path: marble.tasks.Chords1217.probe.ProbeOnEmbeddingsTask
  init_args:
    sample_rate: 16000
    use_ema: false
    encoder:
      class_path: marble.encoders.identity.model.IdentityEncoder
      init_args: {}
    emb_transforms: []
    decoders:
    - class_path: marble.modules.decoders.MLPDecoderKeepTime
      init_args:
        in_dim: 192
        out_dim: 25
        hidden_layers:
        - 512
        activation_fn:
          class_path: torch.nn.ReLU
        dropout: 0.2
    losses:
    - class_path: marble.tasks.Chords1217.probe.ChordCrossEntropyLoss
      init_args:
        time_dim_mismatch_tol: 5
    metrics:
      train:
        acc: &id001
          class_path: marble.tasks.Chords1217.probe.ChordAccuracy
          init_args:
            time_dim_mismatch_tol: 5
            ignore_index: -1
      val:
        acc: *id001
      test:
        acc: *id001
data:
  class_path: marble.tasks.Chords1217.datamodule.Chords1217EmbeddingDataModule
  init_args:
    embedding_root: /scratch/embeddings/probing/mt2_chords1217/
    layer_idx: 0
    train_jsonl: data/Chords1217/Chords1217.train.jsonl
    val_jsonl: data/Chords1217/Chords1217.val.jsonl
    test_jsonl: data/Chords1217/Chords1217.test.jsonl
    batch_size: 32
    num_workers: 4
    clip_seconds: 4
    label_freq: 32
    min_clip_ratio: 0.1
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.001
lr_scheduler:
  class_path: lightning.pytorch.cli.ReduceLROnPlateau
  init_args:
    mode: max
    factor: 0.5
    patience: 5
    monitor: val/acc
