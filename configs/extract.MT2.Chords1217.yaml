seed_everything: 1234
ckpt_path: null
trainer:
  fast_dev_run: false
  accelerator: gpu
  devices: [0]
  num_nodes: 1
  precision: 32
  max_epochs: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 100
  limit_test_batches: 1
  callbacks: []
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: /scratch/embeddings/probing/mt2_chords1217/
model:
  class_path: marble.tasks.ExtractRepresentations.extract.ExtractRepresentationsTask
  init_args:
    sample_rate: 16000
    use_ema: false
    encoder:
      class_path: marble.encoders.MT2.model.MT2_Encoder
      init_args:
        pre_trained_folder: null
        train_mode: freeze
        pooling_mode: seq_only
    emb_transforms:
    - class_path: marble.modules.transforms.LayerSelector
      init_args:
        layers: ["all"]
    extraction:
      split: train
      output_dir: /scratch/embeddings/probing/mt2_chords1217/
      save_split_subdir: true
      save_frame_level: true
      save_sequence_level: false
      max_samples: null
data:
  class_path: marble.tasks.Chords1217.datamodule.Chords1217DataModule
  init_args:
    batch_size: 16
    num_workers: 4
    train:
      class_path: marble.tasks.Chords1217.datamodule.Chords1217AudioTrain
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 4
        min_clip_ratio: 0.1
        channel_mode: random
        jsonl: data/Chords1217/Chords1217.train.jsonl
        label_freq: 32
    val:
      class_path: marble.tasks.Chords1217.datamodule.Chords1217AudioVal
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 4
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/Chords1217/Chords1217.val.jsonl
        label_freq: 32
    test:
      class_path: marble.tasks.Chords1217.datamodule.Chords1217AudioTest
      init_args:
        sample_rate: 16000
        channels: 1
        clip_seconds: 4
        min_clip_ratio: 0.1
        channel_mode: mix
        jsonl: data/Chords1217/Chords1217.test.jsonl
        label_freq: 32
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.001
lr_scheduler: null
